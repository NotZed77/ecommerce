

services:
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - ecommerce-network

  order-db:
    image: postgres
    container_name: order-db
    environment:
      - POSTGRES_DB=orderDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Dansat@12
    networks:
      - ecommerce-network
    volumes:
      - order-db-data:/var/lib/postgres/data

  inventory-db:
    image: postgres
    container_name: inventory-db
    environment:
      - POSTGRES_DB=inventoryDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Dansat@12
    networks:
      - ecommerce-network
    volumes:
      - inventory-db-data:/var/lib/postgres/data

  discovery-service:
    build: ./discovery-service
    image: notzed77/discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  config-server:
    build: ./config-server
    image: notzed77/config-server
    container_name: config-server
    networks:
      - ecommerce-network
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy


  inventory-service:
    build: ./inventory-service
    image: notzed77/inventory-service
    container_name: inventory-service
    networks:
      - ecommerce-network
    depends_on:
      - config-server
      - zipkin
      - inventory-db

  order-service:
    build: ./order-service
    image: notzed77/order-service
    container_name: order-service
    networks:
      - ecommerce-network
    depends_on:
      - config-server
      - zipkin
      - order-db

  api-gateway:
    build: ./api-gateway
    image: notzed77/api-gateway
    container_name: api-gateway
    networks:
      - ecommerce-network
    depends_on:
      - inventory-service
      - order-service
    ports:
      - "8080:8080"



volumes:
    order-db-data:
    inventory-db-data:

networks:
  ecommerce-network:
